[workspace]
members = [
    "apps/adm-cli",
    "apps/adm-desktop",
    "crates/adm-foundation",
    "crates/adm-config",
    "crates/adm-archive",
    "crates/adm-runtime",
    "crates/adm-ai",
    "crates/adm-pipeline",
    "crates/adm-application",
    "crates/adm-design",
    "crates/adm-development",
    "crates/adm-assets",
    "crates/adm-packaging",
    "crates/adm-sdk",
    "crates/adm-ui-model",
    "crates/adm-validation",
    "crates/adm-testkit",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "UNLICENSED"

[workspace.lints.rust]
unsafe_code = "forbid"
